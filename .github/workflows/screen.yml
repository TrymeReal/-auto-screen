name: Auto Screen
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
concurrency:
  group: screen
  cancel-in-progress: true
jobs:
  screen:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore cache
        id: cache-data
        uses: actions/cache@v4
        with:
          path: |
            seen.json
            positions.json
          key: data-${{ github.run_id }}
          restore-keys: data-
      - run: npm install
      - run: npm install -g gmgn-cli
      - run: node screen.js
        env:
          CI: 'false'

          # --- Sudah ada di Secrets, tetap pakai secrets ---
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_THREAD_ID: ${{ secrets.TG_THREAD_ID }}
          TG_THREAD_MIG: ${{ secrets.TG_THREAD_MIG }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GMGN_API_KEY: ${{ secrets.GMGN_API_KEY }}

          # --- Cari ulang di Telegram Web kalau grup pakai fitur Topics ---
          TG_THREAD_ENTRY: ${{ secrets.TG_THREAD_ENTRY }}
          TG_THREAD_SIGNAL: ${{ secrets.TG_THREAD_SIGNAL }}

          # RADAR_BRIDGE_URL / RADAR_BRIDGE_SECRET: sengaja di-skip (tidak dipakai)

          # --- Threshold & config, di-hardcode dari file lama ---
          SIGNAL_ENABLED: 'false'
          MIN_LP: '15000'
          MIN_VOL_1H: '60000'
          MIN_SWAPS_5M: '50'
          MIN_VOL_5M: '5000'
          MAX_AGE_HOURS: '24'
          MIN_BUY_RATIO: '51'
          MAX_INSIDER_PCT: '10'
          MAX_RUG_SCORE: '40'

          # --- Mode 1: gate warning (GMGN risk) — sebelumnya pakai default kode, sekarang eksplisit ---
          MAX_BUNDLER_PCT: '40'
          MAX_TOP10_HOLDERS: '25'
          MAX_DEV_HOLD: '10'
          MAX_PRICE_CHANGE_1H: '20'
          MIN_HOLDERS_MIG: '100'
          MAX_SNIPER_PCT: '10'
          MAX_VOL_LP_RATIO: '300'
          MAX_CREATOR_TOKENS: '6'

          # --- Mode 2: Swing 1D — sebelumnya pakai default kode, sekarang eksplisit ---
          SWING_MIN_LP: '30000'
          SWING_MIN_VOL1H: '20000'
          SWING_MAX_CHG1H: '15'
          SWING_MAX_CHG24H: '50'
          SWING_VOL_SPIKE: '2.0'
          SWING_MIN_HOLDERS: '500'
          SWING_MIN_AGE_H: '24'
          SWING_MAX_AGE_H: '168'
      - name: Push JSON data to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f positions.json tracking_log.json seen.json
          git diff --staged --quiet || git commit -m "chore: update data [skip ci]"
          git push
