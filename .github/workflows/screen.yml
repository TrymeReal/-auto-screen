name: Auto Screen
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
concurrency:
  group: screen
  cancel-in-progress: false
jobs:
  screen:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore cache
        id: cache-data
        uses: actions/cache@v4
        with:
          path: |
            seen.json
            positions.json
          key: data-${{ github.run_id }}
          restore-keys: data-
      - run: npm install
      - run: npm install -g gmgn-cli
      - run: node screen.js
        env:
          CI: 'false'
          # --- Sudah ada di Secrets, tetap pakai secrets ---
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_THREAD_ID: ${{ secrets.TG_THREAD_ID }}
          TG_THREAD_MIG: ${{ secrets.TG_THREAD_MIG }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GMGN_API_KEY: ${{ secrets.GMGN_API_KEY }}
          # --- Toggle kirim Telegram (true/false), diatur dari Secrets ---
          TG_ENABLED: ${{ secrets.TG_ENABLED }}
          # --- Cari ulang di Telegram Web kalau grup pakai fitur Topics ---
          TG_THREAD_ENTRY: ${{ secrets.TG_THREAD_ENTRY }}
          TG_THREAD_SIGNAL: ${{ secrets.TG_THREAD_SIGNAL }}
          # RADAR_BRIDGE_URL / RADAR_BRIDGE_SECRET: sengaja di-skip (tidak dipakai)
          # --- Threshold & config, di-hardcode dari file lama ---
          SIGNAL_ENABLED: 'false'
          MIN_LP: '25000'
          MIN_VOL_1H: '50000'
          MIN_SWAPS_5M: '40'
          MIN_VOL_5M: '5000'
          MAX_AGE_HOURS: '1'
          MIN_BUY_RATIO: '53'
          MAX_INSIDER_PCT: '10'
          MAX_RUG_SCORE: '100'
          # --- Mode 1: gate warning (GMGN risk) — sebelumnya pakai default kode, sekarang eksplisit ---
          MAX_BUNDLER_PCT: '50'
          MAX_TOP10_HOLDERS: '24'
          MAX_DEV_HOLD: '5'
          MAX_PRICE_CHANGE_1H: '20'
          MIN_HOLDERS_MIG: '60'
          MAX_SNIPER_PCT: '15'
          MAX_VOL_LP_RATIO: '300'
          MAX_CREATOR_TOKENS: '20'
          # --- Mode 1: gate baru (social source / paid dex / KOL) — bisa
          # di-tuning langsung dari workflow ini tanpa ubah kode ---
          # Sumber cek social: GMGN (default, cepat, tanpa API call
          # tambahan) | DEX (DexScreener) | BOTH (GMGN dulu, fallback DEX).
          SOCIAL_SOURCE: 'GMGN'
          # Wajib paid DEX (DexScreener) sebelum token lolos. Set 'false'
          # buat matiin gate ini.
          REQUIRE_PAID_DEX: 'true'
          # Minimal KOL/wallet ternama (t.renowned_count dari GMGN) yang
          # pegang/pernah trading token. Set '0' buat matiin gate ini.
          MIG_MIN_KOL: '1'
          # --- Mode 1: gate Dev Best-ATH — skip token kalau riwayat dev
          # (creator wallet) belum pernah punya token lain yang tembus ATH
          # market cap >= DEV_MIN_BEST_ATH. Set DEV_ATH_GATE_ENABLED=false
          # buat matiin gate ini. DEV_ATH_TIMEOUT_MS sengaja tidak diset,
          # pakai default kode (10000ms). ---
          DEV_ATH_GATE_ENABLED: 'true'
          DEV_MIN_BEST_ATH: '150000'
          # Wallet dev yang belum pernah bikin token sama sekali (riwayat
          # kosong) ikut DI-SKIP, bukan dilolosin.
          DEV_ATH_ALLOW_NEW_WALLET: 'false'
          # --- Mode 2: Swing 1D — sebelumnya pakai default kode, sekarang eksplisit ---
          SWING_MIN_LP: '50000'
          SWING_MIN_VOL1H: '40000'
          SWING_MAX_CHG1H: '15'
          SWING_MAX_CHG24H: '50'
          SWING_VOL_SPIKE: '2.0'
          SWING_MIN_HOLDERS: '500'
          SWING_MIN_AGE_H: '1'
          SWING_MAX_AGE_H: '168'
          # Minimal KOL/wallet ternama (t.renowned_count dari GMGN) khusus
          # mode Swing. Set '0' buat matiin gate ini.
          SWING_MIN_KOL: '1'
          # --- Mode 2: Swing 1D — gate Top 1-4 holder individual (dari
          # RugCheck, data per-wallet #1/#2/#3/#4, bukan gabungan top10).
          # Masing-masing angka = batas MAKSIMAL % kepemilikan wallet di
          # posisi itu. Set '0' buat matiin gate posisi tsb (default mati). ---
          SWING_MAX_TOP1: '8'
          SWING_MAX_TOP2: '4'
          SWING_MAX_TOP3: '3'
          SWING_MAX_TOP4: '3'
      - name: Push JSON data to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f positions.json tracking_log.json seen.json
          git diff --staged --quiet || git commit -m "chore: update data [skip ci]"
          git push
